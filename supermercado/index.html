<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Supermercado · Dashboards</title>
  <link rel="stylesheet" href="../estilos.css">
  <script src="../comun.js"></script>
</head>
<body data-raiz="../" data-pagina="supermercado">
  <aside id="menu"></aside>

  <main class="pagina">
    <div class="barra">
      <div class="grupo-botones" id="periodo" role="group" aria-label="Periodo">
        <button data-dias="30">30 días</button>
        <button data-dias="90" class="actual">90 días</button>
        <button data-dias="365">1 año</button>
        <button data-dias="0">Todo</button>
      </div>
      <div class="grupo-botones" id="tienda" role="group" aria-label="Tienda">
        <button data-tienda="" class="actual">Todas</button>
        <button data-tienda="Mercadona"><span class="punto s1"></span>Mercadona</button>
        <button data-tienda="Alcampo"><span class="punto s2"></span>Alcampo</button>
      </div>
      <select class="campo" id="categoria" aria-label="Categoría"><option value="">Todas las categorías</option></select>
      <input class="campo" id="buscar" type="search" placeholder="Buscar un producto" aria-label="Buscar un producto">
      <span class="hueco"></span>
      <span class="nota" id="actualizado"></span>
    </div>

    <section class="rejilla cifras" id="cifras"></section>

    <section class="rejilla dos">
      <div class="tarjeta">
        <div class="cab"><h2>Coste de la cesta</h2><span class="hueco"></span><button class="enlace" data-tabla="cesta-tabla">Ver tabla</button></div>
        <div class="leyenda" id="cesta-leyenda"></div>
        <div class="grafica" id="cesta"></div>
        <div class="tabla-ancha" id="cesta-tabla" hidden></div>
      </div>
      <div class="tarjeta">
        <div class="cab"><h2>Cambios de precio por semana</h2><span class="hueco"></span><button class="enlace" data-tabla="semanas-tabla">Ver tabla</button></div>
        <div class="leyenda"><span><span class="punto s1"></span>Mercadona</span><span><span class="punto s2"></span>Alcampo</span></div>
        <div class="grafica" id="semanas"></div>
        <div class="tabla-ancha" id="semanas-tabla" hidden></div>
      </div>
    </section>

    <section class="tarjeta">
      <div class="cab"><h2>Productos</h2><span class="hueco"></span><span class="menor">Primero los que más han cambiado en el periodo</span></div>
      <div class="tabla-ancha" id="productos"></div>
    </section>
  </main>

  <dialog id="detalle">
    <button class="campo cierre" id="cerrar">Cerrar</button>
    <h2 id="detalle-nombre"></h2>
    <p class="menor" id="detalle-sub"></p>
    <div class="grafica" id="detalle-grafica"></div>
    <div class="tabla-ancha" id="detalle-tabla"></div>
  </dialog>

  <script src="panel.js"></script>
</body>
</html>
