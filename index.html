<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboards</title>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js"></script>
  <script src="common.js"></script>
</head>
<body data-root="" data-page="summary">
  <aside id="menu"></aside>

  <main class="page">
    <div class="title" id="headline"><span class="dot"></span><span data-i18n="summary.title">Summary</span></div>
    <div class="alerts" id="alerts"></div>

    <!-- A new dashboard is a card here, its entry in the menu of common.js and its folder. -->
    <div class="section" data-i18n="menu.shopping">Shopping</div>
    <div class="grid summary">
      <a class="card summary" href="groceries/" id="groceries-card">
        <div class="head">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
          <h2 data-i18n="menu.groceries">Groceries</h2><span class="spacer"></span><span class="dot" id="groceries-dot"></span>
        </div>
        <div class="stat">
          <div class="value" id="groceries-value">—</div>
          <div class="sub" id="groceries-sub" data-i18n="summary.loading">Loading prices…</div>
        </div>
        <div class="lines" id="groceries-lines"></div>
        <div class="foot" id="groceries-foot"></div>
      </a>
    </div>
  </main>

  <script>
    applyTexts();
    (async () => {
      let data;
      try { data = await loadPrices(''); } catch (error) {
        $('groceries-sub').textContent = t('summary.loadError');
        return;
      }
      const today = data.updated;
      const weekAgo = minusDays(today, 7);
      const list = data.list;
      // The basket is each product at its cheapest store; the changes are of every offer.
      const groups = data.groups;
      const basket = groups.reduce((sum, p) => sum + productPrice(p, today, today), 0);
      const changed = list
        .map((p) => ({ p, before: priceAt(p, weekAgo) ?? p.prices[0][1], now: p.prices.at(-1)[1] }))
        .filter((c) => c.before !== c.now)
        .sort((a, b) => Math.abs(b.now - b.before) / b.before - Math.abs(a.now - a.before) / a.before);
      const up = changed.filter((c) => c.now > c.before).length;
      const down = changed.length - up;
      const basketBefore = groups.reduce((sum, p) => sum + productPrice(p, weekAgo, today), 0);

      const status = changed.length && basket > basketBefore ? 'warn' : 'ok';
      $('headline').innerHTML = `<span class="dot ${status}"></span>${changed.length ? t('summary.changed', { n: changed.length }) : t('summary.noChanges')}`;
      $('alerts').innerHTML = changed.slice(0, 6).map((c) => `<a class="chip" href="groceries/?p=${encodeURIComponent(c.p.id)}"><b>${esc(c.p.name)}</b>${change(c.before, c.now, true)}<span class="of">${esc(c.p.store)}</span></a>`).join('')
        + (changed.length > 6 ? `<a class="chip" href="groceries/"><span class="of">${t('summary.more', { n: changed.length - 6 })}</span></a>` : '');

      const perStore = {};
      list.forEach((p) => { perStore[p.store] = (perStore[p.store] || 0) + 1; });
      $('groceries-dot').className = `dot ${status}`;
      $('groceries-value').textContent = money.format(basket);
      $('groceries-sub').textContent = t('summary.basket', { n: groups.length });
      $('groceries-lines').innerHTML = [
        changed.length ? t('summary.in7', { change: change(basketBefore, basket) || t('summary.basketSame') }) : t('summary.basketUnchanged'),
        changed.length ? t('summary.upDown', { up, down }) : '',
        Object.entries(perStore).map(([store, n]) => `${esc(store)} ${n}`).join(' · '),
      ].filter(Boolean).map((line) => `<div>${line}</div>`).join('');
      $('groceries-foot').textContent = t('summary.updated', { when: ago(today) });
    })();
  </script>
</body>
</html>
